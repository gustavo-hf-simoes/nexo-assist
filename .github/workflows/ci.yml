name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Configuração da esteira
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Testar os hooks do Claude Code
        run: bash .github/scripts/test-hooks.sh

      - name: Conferir termos proibidos
        run: bash .github/scripts/check-forbidden-terms.sh

  quality:
    name: Qualidade (lint, typecheck, unitários)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integração (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright)
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Valores só de teste; nenhum segredo real.
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_dev
      APP_DATABASE_URL: postgres://nexo:nexo_dev@127.0.0.1:5432/nexo_app
      TICKETS_DATABASE_URL: postgres://nexo:nexo_dev@127.0.0.1:5432/nexo_tickets
      TICKET_SERVICE_URL: http://localhost:4010
      TICKET_SERVICE_TOKEN: ci-test-token-not-a-secret
      TICKET_SERVICE_FAILURE_RATE: "0"
      TICKET_SERVICE_LATENCY_MS: "0"
      NEXO_AGENT_MODEL: test/scripted
      GOOGLE_GENERATIVE_AI_API_KEY: ci-test-key-not-a-secret
      AGENT_MIN_CONFIDENCE: "0.6"
      SESSION_MESSAGE_LIMIT: "30"
      DAILY_LLM_TURN_LIMIT: "500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Gerar o segredo de sessão (efêmero)
        run: echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Subir o banco
        run: docker compose up -d --wait db

      - name: Migrar e popular
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Rodar o Playwright
        run: npm run e2e

      - name: Logs do compose (só em falha)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Enviar o relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
